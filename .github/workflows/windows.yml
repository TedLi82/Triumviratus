name: Windows Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up MSYS2 (Compiler Environment)
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: false
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-make

    - name: Build and Upload Engines
      shell: msys2 {0}
      run: |
        cd source
        
        # 1. Сборка для Core 2 Quad Q9400
        make profile-build ARCH=x86-64
        cp Triumviratus.exe Triumviratus-Core2Quad-Q9400.exe
        make clean
        
        # 2. Сборка для Core i5-3570S
        make profile-build ARCH=x86-64-modern
        cp Triumviratus.exe Triumviratus-i5-3570S.exe

    - name: Upload Core 2 Quad Version
      uses: actions/upload-artifact@v4
      with:
        name: Triumviratus-Core2Quad-Q9400
        path: source/Triumviratus-Core2Quad-Q9400.exe

    - name: Upload i5 Version
      uses: actions/upload-artifact@v4
      with:
        name: Triumviratus-i5-3570S
        path: source/Triumviratus-i5-3570S.exe
