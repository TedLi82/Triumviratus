name: Windows Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Mingw-w64 Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64

    - name: Build Engines for Windows
      run: |
        cd source
        
        # 1. Сборка для Core 2 Quad Q9400 (без POPCNT)
        make profile-build ARCH=x86-64 COMP=mingw
        cp Triumviratus.exe Triumviratus-Core2Quad-Q9400.exe
        make clean
        
        # 2. Сборка для Core i5-3570S (с POPCNT и SSE4)
        make profile-build ARCH=x86-64-modern COMP=mingw
        cp Triumviratus.exe Triumviratus-i5-3570S.exe

    - name: Upload Core 2 Quad Version
      uses: actions/upload-artifact@v4
      with:
        name: Triumviratus-Core2Quad-Q9400
        path: source/Triumviratus-Core2Quad-Q9400.exe

    - name: Upload i5 Version
      uses: actions/upload-artifact@v4
      with:
        name: Triumviratus-i5-3570S
        path: source/Triumviratus-i5-3570S.exe
